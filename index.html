,"~33%","~9%"],"explain":"Age-standardized 19% overall (24% men, 15% women); and only half of hypertensives had been previously diagnosed."},{"id":"num5","cat":"The Numbers","type":"card","q":"Broad-disability anchor you must cite?","a":"Wu 2021 — people with disabilities carry a higher hypertension burden. Always frame BROADLY as 'people with disabilities', not one subgroup."},{"id":"num6","cat":"The Numbers","type":"card","q":"Why games? (the motivation for play)","a":"Non-adherence is central: >40% of patients are non-adherent (Fanaroff 2026). Games are pursued for their voluntary, intrinsic motivation (Kato 2010, Baranowski 2008)."},{"id":"rq1","cat":"Research Questions","type":"card","q":"RQ1?","a":"How is hypertension experienced and managed in Indigenous communities?"},{"id":"rq2","cat":"Research Questions","type":"card","q":"RQ2?","a":"How are serious games and playful health technology used for hypertension self-management?"},{"id":"rq3","cat":"Research Questions","type":"card","q":"RQ3?","a":"What human-centered design methods support building health technology WITH a community, and what gaps remain?"},{"id":"rq4","cat":"Research Questions","type":"mcq","q":"Which word must you NEVER use for the population (dropped Oct 2026)?","a":"underserved","options":["underserved","Indigenous","disability","Navajo"],"explain":"Pavan dropped 'underserved'. Also: disability is CO-CENTRAL with Indigenous, not just a thread."},{"id":"word1","cat":"Wording","type":"mcq","q":"Which phrasing is correct?","a":"hypertension management","options":["hypertension management","hypertension health","games for hypertension","hypertension wellness"],"explain":"Always 'hypertension MANAGEMENT'. The goal is 'a healthy blood pressure.'"},{"id":"word2","cat":"Wording","type":"card","q":"How is disability framed relative to Indigenous?","a":"CO-CENTRAL, not a side thread: it is disabled people in a Navajo context (Hozhoni = adults with intellectual disabilities). Introduce disability in the Introduction and carry it through the framing."},{"id":"two1","cat":"Two Studies","type":"card","q":"What are your two preliminary studies (Hozhoni Gameorama day, equal priority)?","a":"(1) a co-design WORKSHOP (designing) and (2) a play DEPLOYMENT / playtest (playing)."},{"id":"two2","cat":"Two Studies","type":"mcq","q":"Where do the two studies belong in the exam?","a":"Section 11 'Proposed Future Work and Preliminary Work' — as pilots","options":["Section 11 'Proposed Future Work and Preliminary Work' — as pilots","In Results and Discussion as main findings","In the Methods chapter","In the Abstract only"],"explain":"Treated as PILOTS (like Jared's SpokeIt / Cirkus), not as empirical Results/Discussion."},{"id":"str1","cat":"Structure","type":"mcq","q":"The exam ends by connecting what to the gap?","a":"CardioCare Quest (CCQ)","options":["CardioCare Quest (CCQ)","A new RCT protocol","A funding proposal","A systematic meta-analysis"],"explain":"Problem statement = hypertension in Indigenous communities; Methods = how you found the papers; Background = what you read; at the END, how CCQ connects/fills the gap."},{"id":"str2","cat":"Structure","type":"card","q":"Jared's steer on emphasis?","a":"Emphasize TAKEAWAYS, mostly in the Discussion — what the reader should walk away knowing."}];

    (S.gainBadge?'<p>Badge earned: <b>'+esc(L.badge.nm)+'</b></p>':(S.milestone?'<p>'+S.milestone.emo+' Milestone: <b>'+esc(S.milestone.nm)+'</b></p>':'<p>'+(S.firstTime?"Nice work — one more learned!":"Nicely revised.")+'</p>'))+
    '<div class="pts">+'+S.earned+' points · '+S.correct+'/'+S.quiz.length+' correct</div>'+
    (last?'<p>You’ve walked the whole journey — from blood pressure to your novelty and core papers. Come back anytime to keep it sharp. You’ve got this. ❤️</p>':'<p>Ready for the next one?</p>')+
    '<div class="actions" style="justify-content:center;margin-top:18px"><button class="btn ghost" id="replay">Replay</button>'+
    (last?'<button class="btn" id="menu2">Lessons</button>':'<button class="btn" id="cont">Continue →</button>')+'</div></div>';
  if(S.gainBadge)burst(true);
  var cont=$("#cont");if(cont)cont.onclick=function(){openLesson(S.li+1);};
  $("#replay").onclick=function(){openLesson(S.li);};
  var m2=$("#menu2");if(m2)m2.onclick=openMenu;
}

function openMenu(){
  var maxUn=prof.cur;
  var rows=LESSONS.map(function(L,i){var done=prof.done[L.id],unlocked=i<=maxUn;var st=done?"✅":(unlocked?"▶️":"🔒");return '<button class="lrow" data-i="'+i+'"'+(unlocked?"":" disabled")+'><span class="ic">'+L.icon+'</span><span>'+esc(L.name)+'</span><span class="st">'+st+'</span></button>';}).join('');
  $("#sheet").innerHTML='<h3>Your journey</h3>'+rows+'<p class="foot" style="margin-top:14px">Tap any unlocked lesson to jump in.</p>';
  Array.prototype.forEach.call($("#sheet").querySelectorAll(".lrow"),function(b){if(!b.disabled)b.onclick=function(){closeMenu();openLesson(+b.dataset.i);};});
  $("#scrim").classList.add("on");
}
function closeMenu(){$("#scrim").classList.remove("on");}
$("#menu").onclick=openMenu;
$("#scrim").onclick=function(ev){if(ev.target===$("#scrim"))closeMenu();};

(function(){var saved;try{saved=localStorage.getItem("ccq_theme");}catch(e){}if(saved)document.documentElement.setAttribute("data-theme",saved);$("#theme").onclick=function(){var cur=document.documentElement.getAttribute("data-theme");var dark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;var next=dark?"light":"dark";document.documentElement.setAttribute("data-theme",next);try{localStorage.setItem("ccq_theme",next);}catch(e){}};})();

document.addEventListener("keydown",function(ev){
  if(S.phase==="quiz"&&!S.answered&&ev.key>="1"&&ev.key<="9"){var b=$("#stage").querySelector('.choice[data-i="'+(+ev.key-1)+'"]');if(b){ev.preventDefault();b.click();}}
  else if(ev.key==="Enter"){var nx=$("#next");if(nx&&!nx.disabled){ev.preventDefault();nx.click();return;}var ct=$("#cont");if(ct){ev.preventDefault();ct.click();}}
});

var AC;function blip(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=ok?"sine":"triangle";var t=AC.currentTime;if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.08);}else{o.frequency.setValueAtTime(200,t);o.frequency.setValueAtTime(130,t+.1);}g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.start(t);o.stop(t+.26);}catch(e){}}
var fx=$("#fx"),ctx=fx.getContext("2d"),parts=[];
function size(){fx.width=innerWidth;fx.height=innerHeight;}size();addEventListener("resize",size);
function burst(big){var N=big?120:34,cols=["#b4322e","#e4a93a","#1f7a4d","#1d5a8f","#6a3d9a"];for(var i=0;i<N;i++){parts.push({x:innerWidth/2+(Math.random()-.5)*(big?160:70),y:innerHeight*.4,vx:(Math.random()-.5)*10,vy:-Math.random()*12-4,g:.4+Math.random()*.2,c:cols[i%cols.length],s:4+Math.random()*4,life:60+Math.random()*30});}if(!raf)loop();}
var raf=0;function loop(){raf=requestAnimationFrame(loop);ctx.clearRect(0,0,fx.width,fx.height);for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.life--;ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);if(p.life<=0||p.y>fx.height+20)parts.splice(i,1);}ctx.globalAlpha=1;if(!parts.length){cancelAnimationFrame(raf);raf=0;}}
var tT;function toast(msg){var t=document.createElement("div");t.textContent=msg;t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:70;box-shadow:var(--shadow)";document.body.appendChild(t);clearTimeout(tT);tT=setTimeout(function(){t.remove();},1900);}

renderHUD();
openLesson(prof.cur||0);
})();
</script>
</body>
</html>
