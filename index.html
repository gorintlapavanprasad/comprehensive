<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardioCare Quest</title>
<meta name="description" content="A guided, heart-led journey that teaches you the essentials for the CardioCare Quest comprehensive exam, one lesson at a time, with a quick quiz, points, and badges after each.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1e9; --bg2:#ece7da; --panel:#ffffff; --ink:#1c1b19; --soft:#5d5a53; --line:#e4e0d6;
  --brand:#b4322e; --brand2:#1d5a8f; --good:#1f7a4d; --goodbg:#e7f4ec; --bad:#b4322e; --badbg:#fbe9e7; --gold:#e4a93a;
  --bubble:#fff5ee;
  --shadow:0 2px 6px rgba(0,0,0,.06),0 14px 30px rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13151a; --bg2:#0e1014; --panel:#1e2128; --ink:#edeae3; --soft:#a6a299; --line:#2d313a;
  --brand:#ef5b54; --brand2:#5b9bd6; --good:#43b07f; --goodbg:#17311f; --bad:#ef5b54; --badbg:#36201e; --gold:#f0c061;
  --bubble:#262019;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#13151a; --bg2:#0e1014; --panel:#1e2128; --ink:#edeae3; --soft:#a6a299; --line:#2d313a;
  --brand:#ef5b54; --brand2:#5b9bd6; --good:#43b07f; --goodbg:#17311f; --bad:#ef5b54; --badbg:#36201e; --gold:#f0c061;
  --bubble:#262019;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 50% -200px,var(--bg),var(--bg2));color:var(--ink);font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%;min-height:100vh}
.wrap{max-width:660px;margin:0 auto;padding:12px 16px 48px}
h1,h2,h3{font-family:"Baloo 2","Inter",system-ui,sans-serif}
button{font-family:inherit}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(-6px)}50%{transform:translateX(6px)}}

header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg),rgba(0,0,0,0));padding:10px 2px 8px;margin-bottom:6px}
.hrow{display:flex;align-items:center;gap:10px}
.mini{width:34px;height:34px;flex:none}
.title{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:17px;flex:1}
.chip{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.chip small{color:var(--soft);font-weight:700}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;min-width:36px;height:32px;padding:0 9px;cursor:pointer;color:var(--ink);font-size:14px;font-weight:700;box-shadow:var(--shadow)}
.xpwrap{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 2px 4px}
.xpbar{height:100%;background:linear-gradient(90deg,var(--gold),var(--brand));width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.badstrip{display:flex;gap:5px;align-items:center;min-height:22px;padding:0 2px;flex-wrap:wrap}
.badstrip .b{font-size:16px;animation:pop .4s}
.badstrip .none{font-size:11.5px;color:var(--soft);font-weight:600}

.mascot{display:block}
.mascot.bob{animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}

#stage{animation:fade .3s ease}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 22px;box-shadow:var(--shadow)}
.lessonhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 12px;font-size:12.5px;font-weight:800;color:var(--soft)}
.lessonhead .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.lessonhead .nm{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.dots i{width:8px;height:8px;border-radius:999px;background:var(--line);transition:.2s}
.dots i.on{background:var(--brand);width:22px}

.teach{text-align:center}
.teach .big{font-size:52px;line-height:1;margin:2px 0 6px}
.talk{display:flex;gap:12px;align-items:flex-start;text-align:left;margin-top:6px}
.bubble{position:relative;background:var(--bubble);border:1px solid var(--line);border-radius:16px;border-top-left-radius:4px;padding:13px 16px;flex:1}
.bubble h3{margin:0 0 5px;font-size:19px}
.bubble p{margin:0;font-size:15px}
.mteach{width:52px;height:52px;flex:none}

.choices{display:grid;gap:10px;margin-top:4px}
.choice{display:flex;gap:11px;align-items:flex-start;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;cursor:pointer;color:var(--ink);font-size:15px;line-height:1.4;transition:border-color .1s,background .1s,transform .08s}
.choice:hover:not(:disabled){border-color:var(--brand2);transform:translateX(2px)}
.choice:disabled{cursor:default}
.choice .k{flex:none;width:23px;height:23px;border-radius:7px;background:var(--line);color:var(--ink);font-weight:800;font-size:12.5px;display:grid;place-items:center;margin-top:1px}
.choice.correct{border-color:var(--good);background:var(--goodbg)}
.choice.correct .k{background:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--badbg)}
.choice.wrong .k{background:var(--bad);color:#fff}
.qq{font-family:"Baloo 2",sans-serif;font-size:20px;font-weight:700;margin:0 0 4px;line-height:1.3}
.qmeta{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--soft);margin-bottom:8px}
.feedback{gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px;border-left:3px solid var(--gold);background:var(--bubble);font-size:14px;display:none}
.feedback.on{display:flex;animation:fade .2s}
.feedback .mf{width:34px;height:34px;flex:none}

.actions{margin-top:18px;display:flex;gap:10px;align-items:center}
.actions .sp{flex:1}
.btn{background:var(--brand);color:#fff;border:none;border-radius:12px;padding:11px 24px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:var(--shadow)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:9px 16px}
.link{background:none;border:none;color:var(--soft);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;padding:6px}

.complete{text-align:center;padding:10px 6px}
.complete .badgebig{font-size:70px;line-height:1;animation:pop .6s}
.complete h2{margin:8px 0 2px;font-size:24px}
.complete .pts{font-family:"Baloo 2",sans-serif;font-size:18px;font-weight:800;color:var(--brand);margin:4px 0}
.complete p{color:var(--soft);margin:2px 0}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none;animation:fade .2s}
.scrim.on{display:block}
.sheet{position:absolute;right:0;top:0;height:100%;width:min(320px,86%);background:var(--panel);border-left:1px solid var(--line);padding:18px 16px;overflow:auto;box-shadow:var(--shadow)}
.sheet h3{margin:4px 0 12px;font-size:18px}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;color:var(--ink);font-size:14px;font-weight:600}
.lrow:disabled{opacity:.45;cursor:default}
.lrow .st{margin-left:auto;font-size:15px}
.lrow .ic{font-size:18px}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.foot{text-align:center;color:var(--soft);font-size:12px;margin-top:18px}
.kbd{font-family:ui-monospace,monospace;background:var(--line);border-radius:4px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header>
    <div class="hrow">
      <svg class="mascot mini bob" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 88C20 66 8 48 8 32 8 18 19 9 31 9c8 0 15 4 19 11 4-7 11-11 19-11 12 0 23 9 23 23 0 16-12 34-42 56z" fill="var(--brand)"/>
        <circle cx="39" cy="40" r="5" fill="#fff"/><circle cx="61" cy="40" r="5" fill="#fff"/>
        <circle cx="39" cy="41" r="2.3" fill="#1c1b19"/><circle cx="61" cy="41" r="2.3" fill="#1c1b19"/>
        <path d="M40 55 Q50 63 60 55" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="title">CardioCare Quest</span>
      <span class="chip"><small>Lv</small> <span id="hlevel">1</span></span>
      <button class="iconbtn" id="theme" title="Light / dark" aria-label="Theme">&#9680;</button>
      <button class="iconbtn" id="menu" title="Lessons" aria-label="Lessons">&#9776;</button>
    </div>
    <div class="xpwrap"><div class="xpbar" id="xpbar"></div></div>
    <div class="badstrip" id="badstrip"></div>
  </header>

  <div id="stage"></div>
  <p class="foot">Cardio saves your progress on this device &middot; <span class="kbd">1</span>&ndash;<span class="kbd">4</span> answer &middot; <span class="kbd">Enter</span> next</p>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
window.PAPERS=[{"n":1,"rq":"Closest","rqlong":"Closest neighbor: game x hypertension x Indigenous","title":"Sensor-controlled digital game for Native American adults in the Lumbee Tribe with hypertension self-management: study protocol for a randomized controlled trial","year":"2025","venue":"Trials (BMC) 2025, 26:329; DOI 10.1186/s13063-025-09026-y; ClinicalTrials.gov NCT05671406","lead":"Kavita Radhakrishnan","surname":"Radhakrishnan","authors":"Kavita Radhakrishnan; Cheongin Rachel Im; Jada L. Brooks; Gail Currin Fallon; Angelica Rangel; Christine Julien; Matthew O'Hair; Huigang Liang; John Lowe","hook":"Radhakrishnan -> 'Radha + Krishna', the Hindu deities; picture a Texas (UT Austin) nursing professor whose Lumbee players climb 'Heart Health Mountain' guided by their Fitbit. Pair with John Lowe (last author) = the 'low' blood pressure goal and the Native Reliance model.","concept":"Sensor-controlled serious game: real-time wearable (Fitbit) step/behavior data drive avatar progression and rewards, operationalizing a culturally grounded behavior-change model (Native Reliance) for hypertension self-care.","byline":"A sensor-controlled digital game (the 'Native-SCDG', themed 'Heart Health Mountain') for Lumbee Native American adults with hypertension, delivered via a Fitbit-linked mobile game and tested in a 220-person RCT — this is the single closest published neighbor to CardioCare Quest (game x hypertension x Indigenous).","found":"No empirical results reported — this is a protocol. Context/design numbers only: ~32% of ~45,000 Lumbee adults are treated for CV disease; Robeson County age-adjusted CV disease incidence was 217/100,000 vs 160 statewide","drillQ":"What is the primary outcome of the Radhakrishnan Lumbee Native-SCDG trial, and what behavior-change model grounds the game?","drillA":"Primary outcome = objective mean daily step count (via Fitbit) at 3 and 6 months; the game is grounded in John Lowe's Native Reliance model (being responsible, confident, and disciplined), with secondary outcomes including SBP, DBP, BP control, HTN knowledge, self-efficacy, QoL, and cardiac hospitalization."},{"n":2,"rq":"Closest","rqlong":"Closest neighbor: co-design x hypertension game x Indigenous (Pavan's own lab)","title":"Co-Designing Culturally Grounded Mobile Health Games for Hypertension Management in Indigenous Communities","year":"2025","venue":"ASSETS 2025 (27th ACM SIGACCESS Conference on Computers and Accessibility); HHS Public Access author manuscript (PMC 2026-03-31); doi 10.1145/3663547.3746321","lead":"Alison Graham","surname":"Graham","authors":"Alison Graham; Tochukwu Arinze Ikwunne; Jared Duval","hook":"Graham -> 'graham cracker' / Alexander Graham Bell; picture Alison Graham at NAU stacking five game-prototype 'crackers' onto one plate called CardioCare Quest, with advisor Jared Duval (think 'Duval = do-it-all' lab lead) signing off.","concept":"Annotated-portfolio co-design: participatory, culturally grounded Research through Design that yields both concrete artifacts (five game prototypes) and transferable intermediate design knowledge (gamification, reappropriation, situated/playification patterns) reflecting Indigenous epistemologies.","byline":"Pavan's own Playful Health Technology Lab paper: a participatory co-design workshop with 14 Indigenous participants that produced five medium-fidelity mobile-game prototypes for hypertension MANAGEMENT — the prototypes that become CardioCare Quest.","found":"Qualitative design findings (no health outcomes). Five co-designed prototypes: (1) Education - a Jeopardy-style trivia board; (2) Diet - a character/animal 'Chef' companion with checklist cooking goals; (3) Medication Ad","drillQ":"In the Graham et al. ASSETS 2025 co-design study, how many participants were there, what five hypertension-care factors did the prototypes target, and what unified platform will host them?","drillA":"14 Indigenous participants (all female, ages 29-60); five factors = medication adherence, education, exercise, nutrition, and blood-pressure monitoring; the five prototypes will be hosted on a unified platform called CardioCare Quest."},{"n":3,"rq":"RQ1","rqlong":"RQ1: hypertension management technology in Indigenous communities","title":"The Effectiveness of Text Messaging for Detection and Management of Hypertension in Indigenous People in Canada: Protocol for a Randomized Controlled Trial","year":"2017","venue":"JMIR Research Protocols 2017;6(12):e244; doi 10.2196/resprot.7139; PMID 29258978; ClinicalTrials.gov NCT02111226","lead":"Karen Yeates","surname":"Yeates","authors":"Karen Yeates; Norm Campbell; Marion A Maar; Nancy Perkins; Peter Liu; Jessica Sleeth; Carter Smith; Colin McAllister; Diane Hua-Stewart; George Wells; Sheldon W Tobe","hook":"Yeates -> the poet 'W. B. Yeats' (or 'yeast rising'); picture poet-doctor Karen Yeates at Queen's writing twice-weekly text-message 'verses' to First Nations patients, with Sheldon Tobe ('to be?') as the senior trial lead.","concept":"Task-shifted mHealth: community health workers capture accurate BP on a Bluetooth device feeding a closed-loop server that texts guideline-based messages to patients and faxes readings to providers, all co-developed with communities under CBPR and OCAP data-sovereignty principles.","byline":"The DREAM-GLOBAL protocol: an SMS text-messaging + community blood-pressure-measurement system (task-shifted to community health workers) to detect and manage hypertension in six Canadian First Nations communities (and rural Tanzania).","found":"No efficacy results (protocol). Burden/context numbers: hypertension affects >1 billion people and causes ~10 million deaths/year; Canada's awareness-treatment-control rose from 16% (1990) to ~66%; Canadian Indigenous hy","drillQ":"In the DREAM-GLOBAL protocol (Yeates 2017), what two kinds of SMS were compared, who measured the blood pressure, and what was the recruitment target?","drillA":"It compared 12 disease-specific 'active' BP-management messages plus 26 'passive' lifestyle messages versus passive messages alone; BP was measured by task-shifted community health workers / Home-and-Community-Care nurses using a Bluetooth A&D device; the target was 360 participants (176 per group) for 97% power to detect a 4.8 mmHg systolic difference."},{"n":4,"rq":"RQ1","rqlong":"RQ1: hypertension diagnosis technology in Indigenous (RCT)","title":"Diagnosing hypertension in Indigenous Canadians (DREAM-GLOBAL): A randomized controlled trial to compare the effectiveness of short message service messaging for management of hypertension: Main results","year":"2019","venue":"The Journal of Clinical Hypertension (J Clin Hypertens) 2019;21:29-36; doi 10.1111/jch.13434; ClinicalTrials.gov NCT02111226","lead":"Sheldon W. Tobe","surname":"Tobe","authors":"Sheldon W. Tobe; Karen Yeates; Norm R. C. Campbell; Marion A. Maar; Nancy Perkins; Peter P. Liu; Jessica Sleeth; Colin McAllister; Diane Hua-Stewart; George Wells; Jordan Bernick","hook":"Tobe -> Hamlet's 'To be, or not to be'; picture Sheldon Tobe in Toronto asking whether active texts 'to be or not to be' better than passive ones — and the answer is 'no difference' (the null). Tobe = Toronto.","concept":"Null RCT / feasible-but-no-added-benefit: a culturally adapted, task-shifted mHealth texting program was implementable in remote First Nations communities and lowered BP overall, but disease-specific active messages added no benefit over passive lifestyle messages — content specificity alone did not drive BP control.","byline":"The DREAM-GLOBAL MAIN RESULTS: a double-blind RCT in six Canadian First Nations communities showing that disease-specific 'active' hypertension SMS did NOT lower blood pressure more than 'passive' lifestyle SMS alone — a well-run null result.","found":"NULL primary result. Of 301 assessed and 243 registered, 142 were hypertensive during the first two months (71 active / 71 passive at baseline; 64 active / 58 passive analyzed after 20 lost to follow-up; no withdrawals).","drillQ":"What was the primary finding of the DREAM-GLOBAL main-results trial (Tobe 2019) regarding active vs passive hypertension SMS?","drillA":"No significant difference: systolic between-group difference was 0.8 mmHg (95% CI -4.2 to 5.8) and diastolic -1.0 mmHg (P=0.5); BP control was 37.5% (active) vs 32.8% (passive), difference not significant (P=0.6). Both arms improved similarly, so disease-specific active SMS added no benefit over passive lifestyle SMS, though the program was feasibly implemented in First Nations communities."},{"n":5,"rq":"RQ1","rqlong":"RQ1: hypertension management in Navajo Nation (RCT)","title":"Telephone-Based Guideline-Directed Medical Therapy Optimization in Navajo Nation: The Hozho Randomized Clinical Trial (filename/main-article title); the PDF read is the trial PROTOCOL: 'Hozho (Heart Failure OptimiZation at Home to Improve Outcomes) Quality Improvement Model for HF Patients Receiving Care through the Indian Health Service in Navajo Nation'","year":"2024","venue":"Not reported in pages read (the PDF is the protocol/supplement, version dated 9/10/2022; ClinicalTrials.gov NCT05792085). Main-article journal and year (2024) not present in this PDF.","lead":"Lauren A. Eberly","surname":"Eberly","authors":"Lauren A. Eberly. The protocol PDF itself carries no author byline in the pages read; it references heart-failure experts at the University of Pennsylvania and primary-care providers at the Indian Health Service. Full author list = not reported in pages read.","hook":"Eberly -> sounds like 'Eagerly' (and 'Eber + Lee'); picture a Penn cardiologist 'eagerly' phoning Navajo Nation patients to stack their four heart-failure medications at home, under the Dine value 'Hozho' (balance/harmony) - here a backronym for Heart Failure OptimiZation at Home.","concept":"Centralized telehealth GDMT optimization: a study team, not the overburdened local provider, proactively initiates and uptitrates evidence-based cardiac medications remotely using home BP/HR monitoring, evaluated with a stepped-wedge cluster design under a consent waiver and Navajo Nation IRB oversight.","byline":"A stepped-wedge randomized trial of a telephone-based, home-BP-monitored model in which a study team optimizes guideline-directed medical therapy (the 4 heart-failure pillars) for HFrEF patients in Navajo Nation via the Indian Health Service.","found":"No empirical results in the pages read (this is the protocol; Table 1 baseline characteristics appear only as an unfilled template). Pre-specified primary outcome: proportion of patients with an increase in the number of","drillQ":"What does 'Hozho' stand for in the Eberly Navajo Nation trial, what study design and primary outcome does the protocol specify, and what key caveat applies to this PDF?","drillA":"'Hozho' = Heart Failure OptimiZation at Home to Improve Outcomes; it is a stepped-wedge cluster RCT (5 clusters, 30-day crossovers, 6 months) at two IHS sites in Navajo Nation; the primary outcome is the proportion of HFrEF patients with an increase in prescribed guideline-directed therapy classes at 30 days. Caveat: the PDF read is the PROTOCOL (heart-failure focused, with a blank baseline table), so the main article's authors, journal, and actual results are not present."},{"n":6,"rq":"RQ1","rqlong":"RQ1: wearables / digital health in older Indigenous adults","title":"Wearables are a viable digital health tool for older Indigenous adults living remotely in Australia","year":"2024","venue":"DIGITAL HEALTH (SAGE), Volume 10, open access; DOI 10.1177/20552076241277039","lead":"Connie Henson","surname":"Henson","authors":"Connie Henson; Ben Freedman; Boe Rambaldini; Bronwyn Carlson; Carmen Parter; Chrishan J Nalliah; Felicity Chapman; Gina Shepherd; Jessica Orchard; John Skinner; Josephine Gwynn; Rona Macniven; Robyn Ramsden; Sophia Nala'Kixsisa'las Speier; Suud Mohamed Nahdi; Vita Christie; Yansong Huang; Katrina D Ward; Kylie Gwynne","hook":"'Connie HENSON' - picture a hen (HEN-son) wearing a smartwatch; a 'connie' (convenient) wearable the hen finds comfortable.","concept":"Codesigned, culturally safe wearables are acceptable and feasible for remote older Indigenous adults (acceptability/feasibility, not efficacy).","byline":"Henson et al., DIGITAL HEALTH (SAGE), 2024 - a codesigned mixed-methods feasibility study of heart-health wearables with older Aboriginal adults in remote NSW.","found":"Despite daytime temperatures of 32.2-36.8 degrees C and patchy internet, all 11 participants completed the program (patches used by all 11; 2 could not use the watch due to phone/band issues). Devices were rated highly a","drillQ":"In Henson et al. (2024), how many older Indigenous participants completed the 5-day wearables program, and what single clinical event validated the AF care pathway?","drillA":"Eleven participants (aged 55-78) completed it despite 32-37 degree C heat; on day 3 one participant's watch detected possible AF, which was confirmed by a 12-lead ECG and referred to cardiology - showing the culturally safe care pathway functioned."},{"n":7,"rq":"RQ1","rqlong":"RQ1: hypertension burden in Navajo (foundational prevalence)","title":"Prevalence of Hypertension among Navajo Indians: Findings from the Navajo Health and Nutrition Survey","year":"1997","venue":"The Journal of Nutrition, 127: 2114S-2119S (supplement, American Society for Nutritional Sciences)","lead":"Chris Percy","surname":"Percy","authors":"Chris Percy; David S. Freedman; Tim J. Gilbert; Linda White; Carol Ballew; Ali Mokdad","hook":"'PERCY' - think 'per-cent': Percy counts the percent (prevalence) of Navajo with high blood pressure.","concept":"Navajo hypertension rose from near-zero (1930s) to ~19% age-standardized by the early 1990s, clustered with obesity and diabetes, with half of cases undiagnosed.","byline":"Percy et al., The Journal of Nutrition, 1997 (127:2114S-2119S) - the first population-based estimate of hypertension prevalence on the Navajo Nation.","found":"Age-standardized hypertension prevalence was 19% overall (24% in men, 15% in women); the unadjusted rate was 17%. Prevalence rose steeply with age, BMI and central (truncal) obesity. In men, hypertension was strongly tie","drillQ":"In Percy et al. (1997), what was the age-standardized prevalence of hypertension among Navajo adults, and what fraction of people with elevated blood pressure had previously been told they had it?","drillA":"Age-standardized prevalence was 19% overall (24% in men, 15% in women); only about 50% of those with an elevated reading at examination had ever been told by a clinician that they had high blood pressure - indicating large under-diagnosis."},{"n":8,"rq":"RQ1","rqlong":"RQ1: hypertension burden in adults with intellectual disability","title":"Hypertension in Adults With Intellectual Disability: Prevalence and Risk Factors","year":"2020","venue":"American Journal of Preventive Medicine, 58(5):630-637 (open access)","lead":"Elizabeth C. Schroeder","surname":"Schroeder","authors":"Elizabeth C. Schroeder; Lindsay DuBois; Molly Sadowsky; Thessa I.M. Hilgenkamp","hook":"'SCHROEDER' - think of Schroeder from Peanuts hunched over his piano; here he's hunched measuring blood pressure cuffs on 33,000 Special Olympics athletes.","concept":"Hypertension affects ~48% of adults with intellectual disability (2017 ACC/AHA); no physical activity triples and obesity at least doubles the odds - both modifiable.","byline":"Schroeder et al., Am J Prev Med, 2020 (58(5):630-637) - the first population-based hypertension prevalence estimate in adults with intellectual disability, using 33,122 Special Olympics athletes.","found":"Overall hypertension prevalence was 48.0% (95% CI 47.5-48.6): 37.9% normotensive, 14.1% elevated, 28.9% Stage 1, 19.1% Stage 2. Men had higher prevalence than women (50.7% vs 43.1%), and prevalence rose with age. Perform","drillQ":"In Schroeder et al. (2020), what was the overall hypertension prevalence among 33,122 adults with intellectual disability, and by how much did performing no physical activity change the odds of hypertension?","drillA":"Overall prevalence was 48.0% (by 2017 ACC/AHA criteria); performing no physical activity roughly tripled the odds of hypertension (OR about 3.06-3.66, versus 1.72 for normal-weight individuals), and obesity at least doubled the odds across all activity levels."},{"n":9,"rq":"RQ1","rqlong":"RQ1: hypertension prevalence and treatment-coverage gap in intellectual disability (meta-analysis)","title":"Hypertension prevalence and coverage and intellectual disability: a systematic review and meta-analysis","year":"2026","venue":"Disability and Health Journal, 19 (2026) 101965 (open access, CC BY); online September 2025","lead":"Rodrigo Vargas-Fernandez","surname":"Vargas-Fernandez","authors":"Rodrigo Vargas-Fernandez; Akram Hernandez-Vasquez; Hannah Kuper","hook":"'VARGAS' - picture gas (Var-GAS) station pumps as blood-pressure gauges; the meta-analysis 'pumps together' many studies, and the treatment tank is running low (lower coverage).","concept":"After age adjustment, adults with intellectual disability likely have HIGHER hypertension prevalence, and clearly have ~39% lower treatment coverage (pooled PR 0.61) - a management/access gap.","byline":"Vargas-Fernandez et al., Disability and Health Journal, 2026 (19:101965) - the first meta-analysis pooling hypertension prevalence and treatment coverage in adults with vs without intellectual disability.","found":"The pooled unadjusted prevalence ratio for hypertension was 0.71 (95% CI 0.47-1.05; I-squared = 98%) - i.e., apparently similar or slightly lower prevalence in ID, but non-significant. Crucially, only one study (Durbin) ","drillQ":"In Vargas-Fernandez et al. (2026), what happened to the ID-vs-non-ID hypertension prevalence ratio after age adjustment, and what was the pooled treatment-coverage ratio?","drillA":"Unadjusted prevalence looked similar or slightly lower (pooled PR 0.71), but the one age/sex-adjusted study found adults with ID had 42% HIGHER prevalence (adjusted PR 1.42, 95% CI 1.29-1.55) because they are younger; hypertension treatment coverage was about 39% lower in ID (pooled PR 0.61, 95% CI 0.47-0.81)."},{"n":10,"rq":"RQ1","rqlong":"RQ1/RQ2: mobile health for physical activity in intellectual disability (pilot)","title":"Using mobile health to encourage physical activity in individuals with intellectual disability: a pilot mixed methods feasibility study","year":"2023","venue":"Frontiers in Rehabilitation Sciences, 4:1225641 (open access, CC BY); DOI 10.3389/fresc.2023.1225641","lead":"Henriette Michalsen","surname":"Michalsen","authors":"Henriette Michalsen; Andre Henriksen; Gunn Pettersen; Gunnar Hartvigsen; Silje Wangberg; Gyrd Thrane; Reidun Jahnsen; Audny Anke","hook":"'MICHALSEN' - 'Michael-sen' sounds like a Michael playing a mobile game; picture Michael walking around picking up virtual trash (Sorterius) on his phone.","concept":"Tailored mHealth apps and an AR exercise game are acceptable and feasible for adults with ID but need caregiver support; only 22% increased steps, so efficacy is unproven - promising, not yet RCT-ready.","byline":"Michalsen et al., Frontiers in Rehabilitation Sciences, 2023 (4:1225641) - a pilot feasibility trial of two tailored mHealth apps (including an AR game) to boost physical activity in adults with intellectual disability.","found":"Recruitment response rate was only 16% (12 of 74 consented), but retention was 100% and questionnaire data completeness was high (<1% missing), though Fitbit data were ~30% missing at 4 and 12 weeks (rashes, device size,","drillQ":"In Michalsen et al. (2023), what were the two apps tested, and what fraction of participants showed a clinically meaningful increase in daily steps by 12 weeks?","drillA":"The apps were Active Leisure (an accessible activity planner) and Sorterius (an augmented-reality waste-sorting game inspired by Pokemon Go); only 2 of 9 participants (22%) showed a clinically important increase in steps per day at 12 weeks, so feasibility/acceptability were promising but efficacy was not demonstrated."},{"n":11,"rq":"RQ1","rqlong":"RQ1: supported hypertension self-management in intellectual/developmental disability (helpers/caregivers)","title":"Helpers help people with intellectual and developmental disabilities and hypertension to understand their condition and the need to adhere to anti-hypertensive medication","year":"2022","venue":"Disability and Health Journal, Vol. 15, article 101219 (Elsevier)","lead":"Deborah C. Salzberg","surname":"Salzberg","authors":"Deborah C. Salzberg, Wanfang Zhang, Madeline Moran, James Hardin, Suzanne McDermott, Catherine Okoro, NaTasha Hollis","hook":"Salzberg = 'salt-berg' — an iceberg of SALT, the classic blood-pressure villain, so the hypertension author is literally made of salt.","concept":"Including 'Helpers' (family/caregivers) in chronic-disease education improves hypertension knowledge for the dyad, but educating the person with IDD directly via written messages is insufficient.","byline":"First randomized trial testing whether a low-cost educational intervention raises hypertension knowledge among community-dwelling adults with IDD and their family/paid caregivers ('Helpers').","found":"Case Helpers had statistically significant HTN-knowledge gains versus Comparison Members at both 6 and 12 months (Survey 2 linear estimate 9.92, p=0.01; Survey 3 estimate 10.48, p<0.01); log-binomial Case Helpers were 1.","drillQ":"In Salzberg et al. (2022), which group showed statistically significant hypertension-knowledge gains from the educational intervention, and which group did not?","drillA":"Case Helpers (caregivers who received the flyer and monthly messages) improved significantly at both 6 and 12 months and out-scored Comparison Members; Case Members (the adults with IDD themselves) showed no significant improvement."},{"n":12,"rq":"RQ1","rqlong":"RQ1: hypertension health literacy in Deaf people","title":"Understanding health literacy of deaf persons with hypertension in South Korea: A cross-sectional study","year":"2023","venue":"PLOS ONE, 18(11): e0294765","lead":"Gi Won Choi","surname":"Choi","authors":"Gi Won Choi, Sun Ju Chang, Hee Jung Kim, Ha Na Jeong","hook":"Gi Won Choi = 'Gee, won't you CHOICE?' — picture a deaf reader being asked to CHOOSE (Choi) 'know exactly / not know exactly' on a word test; 'Gi-Won' sounds like 'give one' point per word.","concept":"Deaf adults with hypertension have low linguistic, functional, and internet health literacy, so HTN self-management tools must use simple words, short phrases, visual materials, and strengthened medication content rather than text-heavy or assumption-laden digital interfaces.","byline":"First multi-dimensional (linguistic, functional, internet) assessment of health literacy in deaf adults with hypertension in South Korea, to ground future HTN self-management interventions.","found":"Health literacy was low across every dimension. Linguistically, 62.1% scored below a middle-school level despite most having finished high school (mean 33.41/66, 50.6% awareness). Functional literacy was very low: total ","drillQ":"In Choi et al. (2023), how did functional health literacy of deaf Korean adults with hypertension compare to hearing older adults, especially on medication items?","drillA":"It was far lower: total functional literacy was only 17.9% correct and medication-timing items scored 14.7-21.1%, versus roughly 59-84% in comparable older hearing adults, signaling a real risk of medication errors."},{"n":13,"rq":"RQ1","rqlong":"RQ1/RQ3: supporting self-management for adults with mild intellectual disability (expert focus groups)","title":"Lessons from Expert Focus Groups on how to Better Support Adults with Mild Intellectual Disabilities to Engage in Co-Design","year":"2020","venue":"ASSETS '20: The 22nd International ACM SIGACCESS Conference on Computers and Accessibility (ACM), paper 48","lead":"Ryan Colin Gibson","surname":"Gibson","authors":"Ryan Colin Gibson, Mark D. Dunlop, Matt-Mouley Bouamrane","hook":"Gibson = picture a GIBSON guitar handed to a designer - he strums out 'co-design' chords; Ryan 'Colin' keeps the Scottish setting (Glasgow/Dundee).","concept":"Standard HCI co-design methods must be adapted for mild ID - favoring concrete, visual, multi-modal tasks and bounded caregiver roles, and replacing cognitively heavy techniques like think-aloud - and experts can pre-identify barriers before participants are involved.","byline":"Uses two expert focus groups (12 experts) to pre-test and adapt standard co-design activities so adults with mild intellectual disabilities can participate in designing a clinical communication app.","found":"Focus groups, image boards, and paper prototyping were judged accessible for adults with mild ID, but the think-aloud protocol was judged inaccessible (describing actions while operating a prototype was too cognitively d","drillQ":"In Gibson et al. (2020), which one of the four candidate co-design activities did the experts judge inaccessible for adults with mild ID, and what did they recommend instead?","drillA":"The think-aloud protocol was judged inaccessible because narrating actions while using the prototype was too cognitively demanding; the experts recommended a post-task walkthrough (questions after the task) instead."},{"n":14,"rq":"RQ2","rqlong":"RQ2: serious game for chronic-disease (hypertension) self-management","title":"Impact of a Serious Game for Health on Chronic Disease Self-Management: Preliminary Efficacy Among Community Dwelling Adults with Hypertension","year":"2015","venue":"Journal of Health and Human Services Administration, Vol. 38, No. 2, pp. 253-275 (SPAEF)","lead":"Ronald L. Hickman Jr.","surname":"Hickman","authors":"Ronald L. Hickman Jr., John M. Clochesy, Melissa D. Pinto, Christopher Burant, Grant Pignatiello","hook":"Hickman = 'HICK-man with a hickey on his arm' - picture the blood-pressure cuff leaving a mark; the lead author 'hikes' blood pressure down.","concept":"An avatar-based serious game (eSMART-HD) that rehearses self-management and structured patient-provider communication can yield clinically significant within-group BP reductions (~7/5 mmHg), though between-group superiority over screen education was not established in this small trial.","byline":"Randomized controlled trial of eSMART-HD, an avatar-based serious game teaching hypertension self-management and patient-provider communication, versus screen-based HTN education.","found":"Of 144 enrolled, 116 met HTN criteria. There was NO significant between-group difference in BP reduction (the trial was underpowered for subgroups). However, within the eSMART-HD group, systolic BP declined significantly","drillQ":"In Hickman et al. (2015), what was the average blood-pressure change in the eSMART-HD group, and was there a significant between-group difference versus the control?","drillA":"The eSMART-HD group fell about 7 mmHg systolic and 5 mmHg diastolic (significant within-group, meeting the 5-mmHg clinical threshold), but there was NO significant between-group difference versus screen-based education - the trial was underpowered."},{"n":15,"rq":"RQ2","rqlong":"RQ2: game-based mobile app for cardiovascular self-management (RCT design)","title":"Design and rationale of the MyHeartMate study: a randomised controlled trial of a game-based app to promote behaviour change in patients with cardiovascular disease","year":"2019","venue":"BMJ Open, 9:e024269 (protocol; trial registration ACTRN12617000869370)","lead":"Robyn Gallagher","surname":"Gallagher","authors":"Robyn Gallagher, Clara Chow, Helen Parker, Lis Neubeck, David Celermajer, Julie Redfern, Geoffrey Tofler, Thomas Buckley, Tracy Schumacher, Cate Ferry, Alexandra Whitley, Lily Chen, Gemma Figtree","hook":"Gallagher = 'GALLOP-er' - picture a heart galloping on a treadmill; 'My Heart Mate' is the galloping heart's buddy, and Gallagher gallops the heart toward fitness.","concept":"A standalone, theory-driven gamified app anchored by a cared-for 'heart avatar' and real-world secondary-prevention challenges can be evaluated rigorously by RCT, with objective wearable data enabling blinded outcomes.","byline":"Protocol for an RCT of MyHeartMate, a standalone gamified smartphone app with a 'heart avatar' that must be cared for, to boost secondary-prevention behaviours in coronary heart disease patients.","found":"This is a design/rationale (protocol) paper, so no outcome results are reported. The primary outcome is the 6-month between-group difference in physical activity (MET-min/week measured objectively by Fitbit Flex, enablin","drillQ":"What is the primary outcome of the MyHeartMate RCT (Gallagher et al., 2019), and why can it be assessed in a blinded way?","drillA":"The primary outcome is the 6-month between-group difference in physical activity (MET-min/week); it is blinded because activity data upload automatically from the Fitbit Flex wearable rather than being recorded by non-blinded staff."},{"n":16,"rq":"RQ2","rqlong":"RQ2: active video game exercise and blood pressure / fitness (self-determination theory)","title":"The Effects of Active Video Game Exercise Based on Self-Determination Theory on Physical Fitness and Cognitive Function in Older Adults","year":"2022","venue":"Journal of Clinical Medicine (MDPI), vol. 11, article 3984","lead":"Chenglei Zhao","surname":"Zhao","authors":"Chenglei Zhao, Chenxi Zhao, Yunfeng Li, Minmin Zhao, Lin Wang, Jiawei Guo, Longhai Zhang, Yuliang Sun, Xintong Ye, Wenfei Zhu","hook":"'Chen-glay ZHAO' - picture a 'chain' of players doing a 'Zow' (bow) in a Zumba line; the repeated Zhao surnames = a whole family chain of authors from Shaanxi.","concept":"Grounding an exergame in self-determination theory (satisfying competence, autonomy, and relatedness) sustains older adults' exercise motivation and yields real cardiovascular (BP, vital capacity, BMI) and cognitive benefits.","byline":"A 12-week randomized controlled trial that wrapped Nintendo Switch active video games in self-determination theory and lowered both blood pressure and improved cognition in Chinese older adults.","found":"Intervention group showed significant improvements vs control in BMI (F=9.814, p=0.004, d=-0.93, large), vital capacity (+191 mL, F=4.708, p=0.038, d=0.67), systolic BP (reduced ~9.88 mmHg, F=5.28, p=0.028, d=-0.68) and ","drillQ":"In Zhao et al. (2022), what theory structured the exergame intervention, and what happened to systolic/diastolic blood pressure versus the control group?","drillA":"Self-determination theory (competence, autonomy, relatedness) structured 12 weeks of Nintendo Switch active video games; the intervention group's systolic BP dropped ~9.88 mmHg (d=-0.68, p=0.028) and diastolic BP ~6.5 mmHg (d=-0.86, p=0.016), both significant versus control, alongside improved BMI, vital capacity, and spatial cognition."},{"n":17,"rq":"RQ2","rqlong":"RQ2: active video game and post-exercise hypotension in hypertensive adults","title":"A single session of active video game play promotes post-exercise hypotension in hypertensive middle-aged subjects","year":"2018","venue":"Human Movement (University School of Physical Education in Wroclaw), vol. 19, issue 2, pp. 82-89","lead":"Tais Feitosa da Silva","surname":"da Silva","authors":"Tais Feitosa da Silva, Ana Carla Lima de Franca, Mariz Angela Ferreira de Souza, Alexandre Sergio Silva","hook":"'da SILVA' = Brazilian 'silver'; picture a silver dance pad (Dance Dance Revolution) under 'Tais' who 'ties' her shoes to dance - da Silva, the most common Brazilian surname, dancing BP down.","concept":"Post-exercise hypotension (an acute BP drop after activity) can be elicited by a single low-intensity active video game session in hypertensive adults, matching a moderate walk and additionally lowering cardiac sympathetic drive - suggesting pleasure/relaxation adds to the effect.","byline":"A crossover trial showing one 60-minute bout of Dance Dance Revolution drops blood pressure in hypertensive adults as much as a treadmill walk - while also calming cardiac sympathetic drive.","found":"The active video game, despite reaching only ~13.1% of max HR, produced systolic PEH of -14.4 +/- 3.0 mmHg (p<0.0001), statistically similar to moderate treadmill walking's -16.9 +/- 3.3 mmHg (p<0.0001); the no-exercise ","drillQ":"In da Silva et al. (2018), how did one session of Dance Dance Revolution affect systolic blood pressure and cardiac autonomic balance in hypertensive adults, and how did it compare to walking?","drillA":"Systolic BP fell -14.4 mmHg after the active video game, statistically equal to a moderate treadmill walk's -16.9 mmHg (both p<0.0001), despite the game being only ~13% of max HR; uniquely, the game alone cut sympathetic-vagal balance (LF/HF) from 4.2 to 2.3 (p=0.0486), implying an added relaxation/parasympathetic benefit."},{"n":18,"rq":"RQ2","rqlong":"RQ2: gamification in chronic-disease self-management (scoping review)","title":"The Use of Gamification in the Self-Management of Patients With Chronic Diseases: Scoping Review","year":"2023","venue":"JMIR Serious Games, vol. 11, article e39019","lead":"Xiting Huang","surname":"Huang","authors":"Xiting Huang, Xinyue Xiang, Yang Liu, Zhiqian Wang, Zhili Jiang, Lihua Huang","hook":"'Shee-ting HWONG' - picture someone 'shooting' game points into a hospital chart; two Huangs (Xiting and Lihua) book-end the author list like matching 'Huang' goalposts.","concept":"Gamification for chronic-disease self-management is widespread and mostly delivered through active video games, yet it is under-theorized, skewed toward stroke/physical rehabilitation, thin on hypertension, and lacks any standardized way to measure its effect.","byline":"A PRISMA-ScR scoping review of 70 studies mapping how gamification is built, what it does, and how it is (inconsistently) evaluated across chronic diseases - including hypertension.","found":"From 16,221 records, 70 studies met criteria (22 countries; 80% from developed countries; USA most at 26%). Data covered 2193 participants (64.9% female, mean age 55.56). Almost all (97%) used technical support, with act","drillQ":"In Huang et al.'s 2023 scoping review of gamification for chronic-disease self-management, how many studies were included, what was the dominant form, what fraction cited a theory, and where did hypertension rank?","drillA":"70 studies were included (from 16,221 records); active video games were the dominant form (83%); only 44% named a guiding theory; hypertension was a minor focus at just 6/70 studies (9%), far behind stroke (41%), and no unified evaluation standard existed."},{"n":19,"rq":"RQ2","rqlong":"RQ2: health benefits of interactive video game exercise (foundational)","title":"The health benefits of interactive video game exercise","year":"2007","venue":"Applied Physiology, Nutrition, and Metabolism (NRC Research Press), vol. 32, pp. 655-663","lead":"Darren E.R. Warburton","surname":"Warburton","authors":"Darren E.R. Warburton, Shannon S.D. Bredin, Leslie T.L. Horita, Dominik Zbogar, Jessica M. Scott, Ben T.A. Esch, Ryan E. Rhodes","hook":"'WAR-burton' - imagine a 'war button' on a game controller mounted on an exercise bike; Warburton wages 'war' on inactivity from British Columbia.","concept":"Linking a video game to exercise raises adherence, and that higher adherence - not the equipment itself - mediates the superior fitness and blood-pressure benefits: engagement is the active ingredient.","byline":"The foundational RCT showing that bolting an interactive video game onto a stationary bike boosts attendance, fitness, and blood-pressure reduction beyond plain cycling - with adherence as the mechanism.","found":"The video-game group attended far more (78% +/- 18% vs 48% +/- 29%). VO2max rose significantly only in the game group (+11% +/- 5% vs +3% +/- 6% nonsignificant). Resting systolic BP fell significantly more after gaming (","drillQ":"In Warburton et al. (2007), what did interactive video-game cycling do to attendance and systolic BP versus traditional cycling, and what variable mediated the benefits?","drillA":"Game cycling drove 78% attendance vs 48% for traditional cycling, a significant VO2max gain (+11% vs +3%), and a larger systolic BP drop (~9 mmHg, 132 to 123, vs ~3 mmHg); mediation analysis showed attendance fully mediated the gains (about 91% of the systolic-BP-change variance), so engagement/adherence - not the bike - was the active ingredient."},{"n":20,"rq":"RQ3","rqlong":"RQ3: framework for studying complex mHealth interventions in diverse cultural settings","title":"A Framework for the Study of Complex mHealth Interventions in Diverse Cultural Settings","year":"2017","venue":"JMIR mHealth and uHealth, vol. 5, issue 4, article e47","lead":"Marion A Maar","surname":"Maar","authors":"Marion A Maar, Karen Yeates, Nancy Perkins, Lisa Boesch, Diane Hua-Stewart, Peter Liu, Jessica Sleeth, Sheldon W Tobe","hook":"'MAR' like the start of 'Marion' and a 'moor/mar' - picture a researcher at a northern Canadian lake (Ramsey Lake, Sudbury) texting BP readings; 'Maar' sounds like 'mar' as in the First Nations communities she partners with on Manitoulin.","concept":"Evaluating complex mHealth in diverse cultures requires a participatory, emergent framework that examines four organizational levels (patient, provider, community/organization, health system) against implementation themes including cultural congruence and unintended consequences - because meaning is co-constructed, not uniform across cultures.","byline":"A CBPR-grounded process-evaluation framework (4 organizational levels x 5 implementation themes) for culturally diverse mHealth trials, demonstrated on a hypertension texting intervention in Indigenous Canada and Tanzania.","found":"The framework defines four human organizational levels / evaluation domains - patients, providers, community and organization actors, and health systems and settings - crossed with five primary implementation themes: (1)","drillQ":"What two axes define Maar et al.'s (2017) mHealth process-evaluation framework, and what hypertension project and communities did they use to demonstrate it?","drillA":"Four human organizational levels (patients; providers; community/organization actors; health systems and settings) crossed with five implementation themes (major active components, technology, cultural congruence, task shifting, unintended consequences). It was demonstrated on DREAM-GLOBAL, an SMS-plus-Bluetooth-BP-monitor hypertension pragmatic RCT using task shifting, implemented with First Nations communities in Canada and villages in the Kilimanjaro region of Tanzania via CBPR."},{"n":21,"rq":"RQ3","rqlong":"RQ3: use of co-design methodology in cardiovascular-disease secondary prevention interventions","title":"Use of co-design methodology in the development of cardiovascular disease secondary prevention interventions: A scoping review","year":"2023","venue":"Health Expectations (John Wiley & Sons), Vol. 26, Issue 1, pp. 16-29; DOI 10.1111/hex.13633","lead":"Jason Talevski","surname":"Talevski","authors":"Jason Talevski; Stefan T. Kulnik; Rebecca L. Jessup; Roman Falls; Natali Cvetanovska; Alison Beauchamp","hook":"Talevski -> 'TALE-ski' -> picture a storyteller on skis telling the 'tale' of 22 heart-health co-design studies as he carves down a slope.","concept":"Boyd et al.'s six elements of co-design (engage, plan, explore, develop, decide, change), split into an Exploratory phase and a Development phase - the measuring stick this review applies to every included study.","byline":"Lead author Jason Talevski (PhD), Institute for Physical Activity and Nutrition Research (IPAN), Deakin University, Geelong, Victoria, Australia; senior/last author Alison Beauchamp (Monash University). An Australian scoping review of how co-design has been applied to CVD secondary-prevention interventions.","found":"22 studies included (16 mixed-methods, 6 qualitative; mostly post-2014). Most self-labelled 'co-design' (n=10); others used participatory action research (n=3), user-centred design (n=3), community-based participatory re","drillQ":"How many studies did Talevski et al. include, what framework did they judge co-design against, and how many actually tested intervention effectiveness?","drillA":"22 studies (across 45 articles); judged against Boyd et al.'s six-element co-design framework (engage, plan, explore, develop, decide, change); only 8 evaluated effectiveness, with mixed results."},{"n":22,"rq":"RQ3","rqlong":"RQ3/Framework: Playful Health Technology (Pavan's advisor Jared Duval's dissertation framework)","title":"Playful Health Technology: A Participatory, Research through Design Approach to Applications for Wellness","year":"2022","venue":"PhD dissertation, University of California Santa Cruz, Department of Computational Media (Jack Baskin School of Engineering); eScholarship","lead":"Jared Scott Duval","surname":"Duval","authors":"Jared Scott Duval; dissertation committee: Sri Kurniawan, Katherine Isbister, Steve Whittaker","hook":"Duval -> 'doo-VAL' -> picture a playful 'duel in a valley' where the weapons are video-game controllers - a Duval dueling a wicked problem with play.","concept":"Playful Health Technology - and within it the 'Serious Play for Health' vs 'Serious Games for Health' distinction: health play should be structured enough to drive an outcome yet open and flexible enough to be appropriated by different people and contexts.","byline":"Jared S. Duval's UC Santa Cruz PhD dissertation - and this is Pavan's own advisor at NAU's Playful Health Technology Lab. It defines 'Playful Health Technology' as a framework and lays out the Research-through-Design + participatory stance behind CCQ.","found":"Two-fold contribution. Applied: three co-created systems - SpokeIt (a speech-therapy game for children born with cleft lip/palate, his primary project), Spellcasters (a multiplayer VR game repurposed from entertainment i","drillQ":"Name Duval's three applied case-study systems and his two methodological contributions, and give the framework term that titles the dissertation.","drillA":"Case studies: SpokeIt (cleft-palate speech-therapy game), Spellcasters (VR stroke-rehab game), Cirkus (wearable play probe for Sensory-Based Motor Disorder). Methods: Situated Play Design and DREEM (Disability-Related Empathy from Existing Media). Framework: Playful Health Technology."},{"n":23,"rq":"RQ3","rqlong":"RQ3/Framework: what counts as accessibility research (CHI and ASSETS literature survey) - the Kelly Mack paper","title":"What Do We Mean by \"Accessibility Research\"? A Literature Survey of Accessibility Papers in CHI and ASSETS from 1994 to 2019","year":"2021","venue":"CHI '21 - ACM Conference on Human Factors in Computing Systems, Yokohama, Japan; ACM; DOI 10.1145/3411764.3445412 (18 pages)","lead":"Kelly Mack","surname":"Mack","authors":"Kelly Mack; Emma McDonnell; Dhruv Jain; Lucy Lu Wang; Jon E. Froehlich; Leah Findlater","hook":"Mack -> 'Mack truck' -> imagine a big Mack truck hauling 836 stacked accessibility papers from CHI to ASSETS - Kelly Mack delivering the whole field in one load.","concept":"The field is defined empirically by what gets published: a disproportionate 43%+ focus on blind/low-vision users and a median disabled-participant sample of 13 - evidence of whose access is studied and whose is not.","byline":"Lead author Kelly Mack, University of Washington, Seattle; senior authors Jon E. Froehlich and Leah Findlater (UW). The first broad meta-survey of the accessibility-research field across its two flagship HCI venues.","found":"Dataset of 836 accessibility papers (260 from CHI, 576 from ASSETS); 506 hand-coded for 2010-2019. Accessibility research is growing, even outpacing CHI overall. Attention is skewed: over 43% of the last decade's papers ","drillQ":"How many papers did Mack et al. survey overall versus hand-code, and what two headline numbers describe the field's skew and typical sample size?","drillA":"836 papers analyzed over 1994-2019 (260 CHI, 576 ASSETS); 506 hand-coded for 2010-2019. Over 43% of recent papers focus on blind/low-vision users, and the median sample size for disabled/older-adult participant groups is 13."},{"n":24,"rq":"RQ2","rqlong":"RQ2/RQ3: design and prototyping of an app for adults with intellectual and developmental disabilities","title":"The Design and Prototyping of an App to Teach Adults with Intellectual and Developmental Disabilities to Empower Them Against Abuse","year":"2023","venue":"ACM Transactions on Accessible Computing (TACCESS), Vol. 16, No. 2, Article 16, July 2023, 31 pages; DOI 10.1145/3569585","lead":"Krishna Venkatasubramanian","surname":"Venkatasubramanian","authors":"Krishna Venkatasubramanian; Tina-Marie Ranalli; Jack Lanoie; Alexander Sinapi; Andrew Laraw Lama; Jeanine Skorinko; Mariah Freark; Nancy Alterio","hook":"Venkatasubramanian -> 'Venkat + a submarine' -> picture Venkat piloting a submarine that surfaces to 'Recognize' danger - a long name you anchor to the short app name it built.","concept":"Staged, self-advocate-led co-design pipeline - auto-ethnographic co-design -> three content-modality prototype variants -> expert instructor testing -> consolidated prototype -> end-user study - paired with accessibility supports (easy-read language, multimodal content, emoji rewards, grounding activities) for emotionally sensitive content.","byline":"Lead author Krishna Venkatasubramanian, University of Rhode Island (co-first author Tina-Marie Ranalli, a self-advocate, unaffiliated). An expanded TACCESS journal version of an ASSETS '21 paper on co-designing an abuse-education app, 'Recognize,' with the I/DD community.","found":"Participants judged Recognize viable for the I/DD community, and all three content-presentation styles plus the grounding and reward mechanisms had value for handling sensitive material. The authors offer five design rec","drillQ":"What app did Venkatasubramanian et al. build, for whom, and what were the two user-study sample sizes across the staged design process?","drillA":"They built 'Recognize,' a mobile app teaching adults with intellectual and developmental disabilities (I/DD) to recognize and learn about abuse. Preliminary study: 6 I/DD instructor-participants comparing three prototype variants; consolidated-prototype study: 11 I/DD end-user participants."},{"n":25,"rq":"RQ1","rqlong":"RQ1/RQ3: supporting adults with intellectual and developmental disabilities to participate in health-care decisions","title":"Supporting adults with intellectual and developmental disabilities to participate in health care decision making","year":"2018","venue":"Canadian Family Physician / Le Medecin de famille canadien, Vol. 64, April 2018 (Suppl 2), pp. S32-S35 (Clinical Review)","lead":"William F. Sullivan","surname":"Sullivan","authors":"William F. Sullivan; John Heng","hook":"Sullivan -> 'Sully' the calm, patient airline captain (from the Hudson landing) - here 'Sully' patiently supports each patient to land their own health decision safely.","concept":"Supported decision making vs shared decision making: decision-making capacity for adults with IDD is relational, not purely individual, and both trusted caregivers (supported) and the family physician (shared) help the patient participate in decisions that promote their own goals and values - grounded in CRPD Article 12.","byline":"William F. Sullivan (MD CCFP(COE) FCFP PhD) and John Heng (MA), Canadian family-medicine and ethics authors. A clinical review explaining revised 'guideline 3' of Canada's 2018 consensus guidelines on decision-making capacity for adults with I/DD.","found":"It argues that the standard legal/consumer model, which equates decision-making capacity with independent mental capacity, overlooks the relational nature of decisions that matters for adults with IDD and can disadvantag","drillQ":"What two decision-making approaches does Sullivan & Heng's guideline 3 promote, and what rights framework underpins them?","drillA":"Supported decision making (trusted caregivers help the patient understand and express their goals/values) and shared decision making (the family physician collaborates with patient and caregivers); both are grounded in the UN Convention on the Rights of Persons with Disabilities, especially Article 12 on equal legal capacity."},{"n":26,"rq":"RQ3","rqlong":"RQ3: virtual community-based participatory research (CBPR) to culturally adapt a digital hypertension intervention","title":"Virtual Community-Based Participatory Research to Adapt Digital Health Intervention for Hypertension in a Native American Community","year":"2026","venue":"Progress in Community Health Partnerships: Research, Education, and Action (PCHP) — advance online publication","lead":"Cheongin Rachel Im","surname":"Im","authors":"Cheongin Rachel Im; Jada Brooks; Gail Currin Fallon; Matthew O'Hair; Marshirl Locklear; Paula McLean; John Oxendine; James Strickland; Tammie Strickland; Kavita Radhakrishnan","hook":"Im sounds like 'I'm' — picture community-partner Rachel saying 'I'm co-designing this game.' Senior author Radhakrishnan = 'Radha-Krishna' steering the Lumbee quest.","concept":"Virtual community-based participatory research (CBPR) as a method for the culturally authentic adaptation of a serious health game — community as equal co-designers, not test subjects.","byline":"Lumbee Tribe members co-adapt a Fitbit-driven serious game for hypertension self-care through virtual CBPR, led by Radhakrishnan's UT Austin / UNC Chapel Hill nursing team.","found":"The CPC steered concrete adaptations: game journeys to significant Lumbee landmarks and river/valley topography of the Pembroke region; member-contributed landmark images; culturally relevant attire and artifacts (includ","drillQ":"What game did Im et al. (2026) culturally adapt with the Lumbee Tribe, and by what method — and which lab connects it to CardioCare Quest?","drillA":"The sensor-controlled digital game (SCDG), a Fitbit-step-driven game originally built by Good Life Games for heart-failure self-care, adapted for Lumbee hypertension self-care via virtual CBPR with a five-member Community Partnership Committee. Senior author Kavita Radhakrishnan (UT Austin) runs the Lumbee SCDG program cited as a near-neighbor to CCQ."},{"n":27,"rq":"RQ1","rqlong":"RQ1: social determinants of health — racial and disability disparities among older adults","title":"The Role of Social Determinants of Health in Shaping Racial and Disability Disparities Among Older Adults in the United States","year":"2025","venue":"Journal of Aging & Social Policy (Taylor & Francis); DOI 10.1080/08959420.2025.2528584","lead":"Sunkanmi Folorunsho","surname":"Folorunsho","authors":"Sunkanmi Folorunsho","hook":"Folorunsho → 'Folo-run-show' — picture an elder trying to 'follow the run show' but blocked by missing wheelchair ramps; the structural barrier IS the disparity.","concept":"Intersectionality + cumulative disadvantage: SDOH as the 'fundamental cause' whose effects stack across the life course where race and disability overlap.","byline":"A single-author conceptual essay arguing that race and disability intersect — through life-course structural inequity — to drive hypertension and other chronic-disease disparities in older Americans.","found":"The essay argues that race and disability compound across the life course: early-life disadvantage (underserved neighborhoods, discrimination) accumulates into later-life chronic disease and financial insecurity. Structu","drillQ":"What is the central argument of Folorunsho (2025), and what disability-prevalence statistic anchors it?","drillA":"That race and disability intersect across the life course (cumulative disadvantage + intersectionality) so SDOH, not individual behavior, drive hypertension/diabetes disparities in older adults — anchored by American Indian/Alaska Native adults having the highest U.S. disability prevalence at 32% (Black adults 29%)."},{"n":28,"rq":"RQ2","rqlong":"RQ2: mHealth to support hypertension self-care management (scoping review)","title":"Effectiveness of mHealth intervention to support patients' self-care management of hypertension: A scoping review","year":"2026","venue":"Medicine (Wolters Kluwer); 2026;105(1):e46766; DOI 10.1097/MD.0000000000046766 (open access, CC BY-NC)","lead":"Monsurat Oyenike Yakubu","surname":"Yakubu","authors":"Monsurat Oyenike Yakubu; Deborah Tolulope Esan; Ayodeji Olubunmi Ogunmuyiwa; Oluwadamilare Akingbade; Theophilus Olaide Esan; Adeseye Abiodun Akintunde","hook":"Yakubu → 'Ya-KOO-boo' — picture a mobile phone shouting 'Yakubu!' as a BP reminder alarm; the lead author is in Nigeria, so think mHealth reaching underserved regions.","concept":"mHealth self-care management for hypertension — effectiveness plus the facilitator/barrier matrix (gamification and usability vs cost, literacy, privacy, access).","byline":"A Nigeria-led scoping review of 17 studies finding mHealth improves blood-pressure control and medication adherence, with gamification named as a facilitator — but weak on long-term and low-income-country evidence.","found":"Most included mHealth applications significantly benefited hypertension self-management, with intervention groups outperforming controls on blood pressure and adherence. Concrete signals: Dele-Ojo et al. — 44.3% of the i","drillQ":"How many studies did Yakubu et al. (2026) include, and which engagement 'facilitator' in their list matters most for CardioCare Quest?","drillA":"17 included studies (from 116 screened). Alongside user-friendly design, provider communication, accessibility, and personalized messaging, they name gamification as a key facilitator of mHealth engagement for hypertension self-care — the hook CCQ leans on."},{"n":29,"rq":"RQ3","rqlong":"RQ3: co-designing a maternal and child mHealth intervention with Aboriginal and Torres Strait Islander communities","title":"Development of a Maternal and Child mHealth Intervention With Aboriginal and Torres Strait Islander Mothers: Co-design Approach","year":"2022","venue":"JMIR Formative Research (JMIR Form Res 2022;6(7):e33541; doi:10.2196/33541)","lead":"Sarah Jane Perkes","surname":"Perkes","authors":"Sarah Jane Perkes; Belinda Huntriss; Noelene Skinner; Bernise Leece; Rosie Dobson; Joerg Mattes; Kerry Hall; Billie Bonevski","hook":"PERKES sounds like 'perches' - picture Sarah perching alongside Aboriginal mothers, storyboarding an app together.","concept":"Community-governed, culturally safe co-design of Indigenous mHealth around three predetermined themes: design characteristics, content modules, and features/functions.","byline":"A step-by-step worked example of co-designing a culturally safe mHealth intervention with and for Aboriginal and Torres Strait Islander mothers in three NSW communities.","found":"In total 31 mothers and 11 health professionals participated. Mothers identified six priority design characteristics: credibility; Aboriginal and Torres Strait Islander designs and cultural safety; family centeredness; s","drillQ":"In Perkes et al. (2022), what six design characteristics did Aboriginal and Torres Strait Islander mothers identify as essential for the co-designed mHealth intervention, and what three delivery modalities did the final prototype use?","drillA":"Six characteristics: credibility; Aboriginal and Torres Strait Islander designs and cultural safety; family centeredness; supportive; simple to use; confidential. The prototype delivered content via three modalities: a purpose-built app, a Facebook page, and SMS text messaging (plus embedded videos)."},{"n":30,"rq":"RQ3","rqlong":"RQ3: co-design in mHealth systems development (systematic literature review)","title":"Co-design in mHealth Systems Development: Insights From a Systematic Literature Review","year":"2021","venue":"AIS Transactions on Human-Computer Interaction (THCI), 13(2), 175-205 (doi:10.17705/1thci.00147)","lead":"Tyler J. Noorbergen","surname":"Noorbergen","authors":"Tyler J. Noorbergen; Marc T. P. Adam; Mark Roxburgh; Timm Teubner","hook":"NOORBERGEN ~ 'north iceberg' - Tyler charts the iceberg of mHealth co-design, where only the early-phase tip (pre-design/generative) shows above water and the post-design base is hidden.","concept":"Mapping empirical mHealth co-design onto Sanders and Stappers' (2014) four phases (pre-design, generative, evaluative, post-design) reveals heavy clustering in early phases and a near-empty post-design phase.","byline":"A systematic literature review of 61 studies that maps how, when and why designers actually use co-design when building mHealth systems, using Sanders and Stappers' four-phase framework.","found":"Co-designing mHealth is a fragmented but rapidly growing field, with 77% of studies appearing after 2015 and only limited overlap between them. Activity clusters heavily in the early phases (pre-design and generative); t","drillQ":"Which co-design framework did Noorbergen et al. (2021) use to organise their review of 61 mHealth studies, and which of its phases was the most neglected?","drillA":"They used Sanders and Stappers' (2014) four-phase framework: pre-design, generative, evaluative, and post-design. Studies clustered in the early (pre-design and generative) phases, while the post-design phase was almost absent (only 3 studies, 4.9%), which the authors call a profound research gap."},{"n":31,"rq":"RQ3","rqlong":"RQ3: co-design for Indigenous and other children and young people from priority social groups (systematic review)","title":"Co-design for indigenous and other children and young people from priority social groups: A systematic review","year":"2022","venue":"SSM - Population Health, 18 (2022) 101077 (doi:10.1016/j.ssmph.2022.101077)","lead":"Paula Toko King","surname":"King","authors":"Paula Toko King; Donna Cormack; Richard Edwards; Ricci Harris; Sarah-Jane Paine","hook":"KING - Paula Toko King is the 'King' holding co-design to account: who really rules the design, and does it deliver equity for Indigenous young people?","concept":"Co-design for Indigenous and marginalised children/young people is rhetoric-rich but evidence-poor: rarely defined, rarely evaluated, and 'equity' is usually reduced to including participants from an inequity-experiencing group.","byline":"An equity-focused systematic review asking whether co-design actually works - and actually reduces inequities - for Indigenous and other marginalised children and young people in health and disability interventions.","found":"Fifteen studies met inclusion. Despite all using the word 'co-design', only three gave any definition of it; nine described one or more theory-based frameworks and seven reported stepwise phases, with 26 methods, techniq","drillQ":"Of the 15 studies in King et al.'s (2022) equity-focused review, how many actually defined 'co-design' and how many included a formal evaluation, and what was the usual mechanism for 'addressing equity'?","drillA":"Only 3 of the 15 studies defined 'co-design' and only 1 included a formal evaluation. Equity was typically addressed only by including participants from a social group experiencing inequities - rarely anything more - which is why the authors say the literature cannot yet show co-design works or reduces inequities."},{"n":32,"rq":"RQ2","rqlong":"RQ2: design requirements for gamified exercise apps for adults with prehypertension (Octalysis framework + Self-Determination Theory)","title":"Design Requirements for Gamified Exercise Apps for Adults With Prehypertension Based on the Octalysis Framework and Self-Determination Theory: Qualitative Interview Study","year":"2026","venue":"JMIR Serious Games; 2026;14:e86793; DOI 10.2196/86793","lead":"Sijia Li","surname":"Li","authors":"Sijia Li; Genying Liu; Li Qiao; Hong-Yu Yu; Yu-Yang Zhang; Runyuan Pei; Yue-Tao Lin; Hao-Ming Ma; Mei-Hua Piao","hook":"Li (Sijia Li) is a very common surname — tag it with the setting: 'Li in Beijing with Octalysis.' Senior author Piao → 'Piao = piano' — picture eight Octalysis drives as eight piano keys the lead plays.","concept":"Dual-theory design: Octalysis eight core drives mapped onto Self-Determination Theory's autonomy/competence/relatedness to turn extrinsic game mechanics into intrinsic motivation for exercise.","byline":"Interviews with 14 Chinese adults with prehypertension, read through the Octalysis gamification framework and Self-Determination Theory, yield concrete design requirements for a gamified exercise app.","found":"Three domains emerged. (1) Needs and preferences: real-time exercise guidance and posture correction, calendar-integrated automated reminders, individualized plans with clear progress schedules, comprehensive tracking (c","drillQ":"Which two frameworks did Li et al. (2026) combine to derive gamified-exercise-app design requirements for prehypertension, and what was the key design lesson?","drillA":"The Octalysis Gamification Framework (Chou's 8 core drives) plus Self-Determination Theory (autonomy, competence, relatedness), via interviews with 14 Chinese adults. Lesson: gamification must go beyond points/badges to satisfy deeper psychological needs, or engagement and health benefit fade."}];
window.EXAM=[{"id":"g1","cat":"Genre & Framing","type":"mcq","q":"What kind of document is this comprehensive exam?","a":"A scoping literature review","options":["A scoping literature review","An empirical study of CardioCare Quest","A randomized controlled trial","A systems / engineering paper"],"explain":"It demonstrates command of the field, identifies the gap, and proposes future work (Shelby Hagemann's model + Jared's advancement). CCQ connects only at the END."},{"id":"g2","cat":"Genre & Framing","type":"card","q":"What is the exam's title?","a":"\"A Scoping Review of Playful Health Technology for Hypertension Self-Management in Indigenous Communities\" — centered on the intersection: hypertension management with and for Navajo (Indigenous) people who have disabilities."},{"id":"g3","cat":"Genre & Framing","type":"mcq","q":"Which two documents are your structural models?","a":"Shelby Hagemann's CER + Duval's Advancement","options":["Shelby Hagemann's CER + Duval's Advancement","PRISMA 2020 + Cochrane Handbook","Radhakrishnan's protocol + Graham's paper","The NIH grant guide + a Nature review"],"explain":"Shelby's 'Scoping Review on Cross-Disciplinary Bias...' is the primary structure model; Jared's Advancement is the thematic-review + pilot-work model."},{"id":"g4","cat":"Genre & Framing","type":"card","q":"Voice rule for the write-up?","a":"First-person \"I\" for the review / synthesis (Shelby & Jared do this); \"we / our lab\" only for the CCQ project work. Graduate register — not dumbed-down, not jargon-heavy."},{"id":"gap1","cat":"The Gap","type":"card","q":"State THE verified gap in one sentence.","a":"No completed study has deployed a culturally grounded, accessible hypertension-management GAME into a real disability-community setting and studied how adults with disabilities AND their caregivers take it up together."},{"id":"gap2","cat":"The Gap","type":"mcq","q":"Which is still MISSING from the literature (your gap)?","a":"A deployed, community-run hypertension game used by disabled adults and caregivers together","options":["A deployed, community-run hypertension game used by disabled adults and caregivers together","Any serious game that lowers blood pressure","Co-design studies with Indigenous communities","Reviews of gamification for chronic disease"],"explain":"Pieces exist separately; the integrated, deployed, dyad-used game in a disability community does not."},{"id":"gap3","cat":"The Gap","type":"card","q":"What is the caregiver / dyad gap?","a":"Tools assume a lone user, but real use is supported. Caregivers appear only as 'secondary users' (Michalsen, Gibson, Graham). The participant + caregiver dyad jointly using a tool is never studied — Gibson names it only as future scope."},{"id":"gap4","cat":"The Gap","type":"card","q":"Why can't RQ2 claim long-term adoption from your one-day study?","a":"One day cannot measure long-term adoption, so engagement/emotion must be framed as observable CONDITIONS FOR future uptake — not proof of sustained use."},{"id":"nov1","cat":"Novelty","type":"mcq","q":"How many papers occupy CCQ's exact four-way cell (game × hypertension × Indigenous × disability)?","a":"0","options":["0","2","7","27"],"explain":"Verified Oct 2026 across PubMed, ACM, Google Scholar. CCQ is the first; the four literatures each cover at most 3 of the 4 dimensions."},{"id":"nov2","cat":"Novelty","type":"mcq","q":"What are CCQ's four defining dimensions?","a":"Serious game + hypertension self-management + Indigenous (Navajo) + disability","options":["Serious game + hypertension self-management + Indigenous (Navajo) + disability","Wearables + diabetes + rural + elderly","VR + stroke rehab + children + low-income","App + heart failure + urban + caregivers"],"explain":"Built via community co-design. The exact PubMed cell game×hypertension×Indigenous×disability = 0 hits."},{"id":"nov3","cat":"Novelty","type":"mcq","q":"Which paper is CCQ's closest EXTERNAL neighbour?","a":"Radhakrishnan / Im — the Lumbee sensor-controlled digital game","options":["Radhakrishnan / Im — the Lumbee sensor-controlled digital game","Hickman — eSMART-HD avatar game","Yeates / Tobe — DREAM-GLOBAL text messaging","Gallagher — MyHeartMate app"],"explain":"But it's a PROTOCOL (results ~2027), Lumbee not Navajo, general adults not people with disabilities, a sensor game not co-designed narrative play. CCQ is built + deployed."},{"id":"nov4","cat":"Novelty","type":"card","q":"Why is Graham / Ikwunne / Duval 2025 NOT a competitor?","a":"It is your OWN lab (Duval = advisor): games + hypertension + Indigenous, but disability not centered. Frame it as CCQ's foundation / established research program, not a rival."},{"id":"nov5","cat":"Novelty","type":"mcq","q":"Navajo × hypertension returns 42 PubMed papers. How many used a GAME?","a":"0","options":["0","1","5","12"],"explain":"Navajo × game = just 1 (Vigil-Hayes 2019), and that was mental-health resiliency, not hypertension. The 42 are clinical/epi/SMS only (e.g. Percy 1997, Eberly 2024, Gittelsohn 2013)."},{"id":"fun1","cat":"Search & Funnel","type":"mcq","q":"How many records did the search identify?","a":"1,759","options":["1,759","1,709","961","527"],"explain":"PubMed 1,539 + ACM 100 + Google Scholar 120 = 1,759 (before de-duplication)."},{"id":"fun2","cat":"Search & Funnel","type":"mcq","q":"How many studies were INCLUDED in the review?","a":"527","options":["527","180","961","90"],"explain":"Hypertension-anchored scope (your choice). RQ2 = 353, RQ1 = 214, RQ3 = 28."},{"id":"fun3","cat":"Search & Funnel","type":"card","q":"Recite the PRISMA-ScR funnel.","a":"1,759 identified → 50 duplicates removed → 1,709 screened (title/abstract) → 748 excluded → 961 assessed for eligibility → 434 excluded (425 not hypertension/cardiovascular + 9 clinician-education) → 527 included."},{"id":"fun4","cat":"Search & Funnel","type":"mcq","q":"How many RQ-aligned queries did the search framework use?","a":"6","options":["6","3","9","12"],"explain":"A 6-query, RQ-aligned framework across PubMed, ACM Digital Library, and Google Scholar (searched Oct 12 2026)."},{"id":"fun5","cat":"Search & Funnel","type":"mcq","q":"Which RQ has the most included papers?","a":"RQ2 (games / playful tech) — 353","options":["RQ2 (games / playful tech) — 353","RQ1 (Indigenous / disability) — 214","RQ3 (co-design) — 28","RQ1 (Indigenous / disability) — 353"],"explain":"RQ2 353, RQ1 214, RQ3 28 — the co-design evidence (RQ3) is thinnest."},{"id":"fun6","cat":"Search & Funnel","type":"card","q":"What was Jared's 'second filtration' plan?","a":"527 → about 180 for the citation pool → about 90 references at the end; and pull roughly 15–25 CORE papers for the methods."},{"id":"num1","cat":"The Numbers","type":"mcq","q":"Global hypertension burden (Carey 2022)?","a":">1 billion adults; only ~44% controlled","options":[">1 billion adults; only ~44% controlled","~200 million adults; ~90% controlled","~50 million adults; ~70% controlled","~500 million adults; ~5% controlled"],"explain":"Hypertension is huge and under-controlled; ordinary tools fail and non-adherence is central."},{"id":"num2","cat":"The Numbers","type":"mcq","q":"Hypertension prevalence in adults with intellectual disability (Schroeder 2020, 33,122 Special Olympics adults)?","a":"48%","options":["48%","19%","12%","71%"],"explain":"Equal-or-greater than the general population — the burden is equal, the CARE is unequal."},{"id":"num3","cat":"The Numbers","type":"mcq","q":"Treatment gap in intellectual disability (Vargas-Fernández 2026 meta-analysis)?","a":"~39% less likely to be treated (PR 0.61)","options":["~39% less likely to be treated (PR 0.61)","Equally likely to be treated","~39% MORE likely to be treated","Twice as likely to be treated"],"explain":"Yet age/sex-adjusted prevalence is 42% HIGHER (PR 1.42): equal/greater burden, unequal care."},{"id":"num4","cat":"The Numbers","type":"mcq","q":"Hypertension prevalence among Navajo adults (Percy 1997)?","a":"~19%","options":["~19%","~48%"
